plugins {
    id "com.gradleup.shadow"
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    shadowCommon
    compileClasspath.extendsFrom shadowCommon
    runtimeClasspath.extendsFrom shadowCommon
    developmentFabric.extendsFrom shadowCommon

    // Tests
    testCompileClasspath.extendsFrom shadowCommon
    testRuntimeClasspath.extendsFrom shadowCommon
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"

    shadowCommon(project(path: ":common", configuration: "namedElements")) { transitive = false }

    testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
}

test {
    include '/tests/**'
    useJUnitPlatform()
}

shadowJar {
    configurations = [project.configurations.shadowCommon]
    archiveClassifier.set "dev-shadow"
}

remapJar {
    injectAccessWidener = true

    inputFile.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier.set null
}

jar {
    archiveClassifier.set "dev"
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

shadow {
    addShadowVariantIntoJavaComponent = false
}

publishing {
    publications {
        mavenFabric(MavenPublication) {
            artifactId = "TranslationFallbacksFabric"
            from components.java
        }
    }
}

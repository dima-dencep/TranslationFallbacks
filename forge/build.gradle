unimined.minecraft {
    combineWith(project(":common").sourceSets.main)

    neoForge {
        loader("net.neoforged:neoforge:$rootProject.neoforge_version:universal")
        mixinConfig("translationfallbacks.mixins.json")

        // accessTransformer aw2at(project(":common").file("src/main/resources/translationfallbacks.classtweaker"))
    }
}

jar {
    archiveClassifier.set null
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

publishing {
    publications {
        mavenNeoForge(MavenPublication) {
            artifactId = "TranslationFallbacksNeo"
            from components.java
        }
    }
}
